[package]
name = "serve-directory"
version = "1.0.0"
authors = ["Joseph Skubal"]
edition = "2024"
repository = "https://github.com/skubalj/serve-directory"
description = "Serve a directory with a single command!"
readme = "README.md"
license = "MIT"
categories = ["command-line-utilities"]
keywords = ["server", "http"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
build_html = "2"
local_ipaddress = "0.1"
log = "0.4"
pico-args = "0.5"

[dependencies.env_logger]
version = "0.11"
default-features = false
features = ["auto-color", "humantime"]

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "signal"]

[dependencies.warp]
version = "0.4"
default-features = false
features = ["server"]

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
strip = true
opt-level = 3
codegen-units = 1
